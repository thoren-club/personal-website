<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Привет!</title>
  <link rel="icon" type="image/jpeg" href="/favicon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #fff;
      color: #000;
      font-family: "Inter", sans-serif;
    }

    h1 {
      margin: 0;
      padding: 1rem;
      font-size: clamp(3.25rem, 10vw, 9rem);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -.06em;
      text-align: center;
      transition: filter .55s ease, opacity .55s ease, transform .55s ease;
      will-change: filter, opacity, transform;
    }

    h1.switching {
      filter: blur(24px);
      opacity: 0;
      transform: scale(.96);
    }

    @media (prefers-reduced-motion: reduce) {
      h1 { transition-duration: .01ms; }
    }
  </style>
</head>
<body>
  <h1 id="hello" aria-live="polite">Привет!</h1>

  <script>
    const greetings = [
      ["Привет!", "ru"],
      ["Hello!", "en"],
      ["Hola!", "es"],
      ["Bonjour!", "fr"],
      ["Ciao!", "it"],
      ["Hallo!", "de"],
      ["Olá!", "pt"],
      ["こんにちは!", "ja"],
      ["안녕하세요!", "ko"],
      ["你好!", "zh"]
    ];

    const hello = document.querySelector("#hello");
    let index = 0;

    setInterval(() => {
      hello.classList.add("switching");

      setTimeout(() => {
        index = (index + 1) % greetings.length;
        hello.textContent = greetings[index][0];
        document.title = greetings[index][0];
        document.documentElement.lang = greetings[index][1];
        hello.classList.remove("switching");
      }, 560);
    }, 2200);
  </script>
</body>
</html>
